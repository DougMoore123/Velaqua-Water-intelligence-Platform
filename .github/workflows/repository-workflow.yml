name: repository-workflow

on:
  workflow_dispatch:
  pull_request:

jobs:
  repository-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Required Governance Files
        run: |
          test -f governance/slo_and_alerts.md
          test -f governance/ownership_and_procedures.md
          test -f governance/production_readiness_review.md
      - name: Validate Approval Artifact Exists
        run: test -f governance/production_approval_record.json
