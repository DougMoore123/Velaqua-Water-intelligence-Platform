name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r services/decision_api/requirements.txt
          pip install -r services/rag_service/requirements.txt
          pip install -r ml/training/requirements.txt
          pip install pytest ruff
      - name: Lint
        run: ruff check services ml scripts tests platform
      - name: Unit Tests
        run: pytest -q tests/test_decision_engine.py tests/test_rag_service.py
      - name: API Tests
        run: pytest -q tests/test_decision_api.py tests/test_api_contracts.py
      - name: Model Tests
        run: pytest -q tests/test_model_governance_gate.py tests/test_inference_score.py
      - name: Schema And Data Quality Tests
        run: pytest -q tests/test_schema_contracts.py tests/test_data_quality_monitor.py
      - name: Deployment Tests
        run: pytest -q tests/test_deployment_workflows.py tests/test_production_approval_gate.py tests/test_orchestrator_scripts.py
